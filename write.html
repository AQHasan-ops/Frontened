<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Syed, Billal, Oishe & Hasan" />
  <title>Cricket Australia Blog - Write Post</title>

  <!-- External CSS file for styling -->
  <link rel="stylesheet" href="styles/style.css" />

  <!-- External JS file for validation -->
  <script defer src="scripts/main.js"></script>
</head>

<body>
  <header>
    <!-- Top banner with site logo and site name -->
    <div class="banner-container">
      <!-- Dark/Light Theme Toggle Button -->
      <button id="themeToggleBtn" title="Toggle Dark/Light Mode">Dark Mode 🌓</button>
      <img src="images/banner.webp" alt="Cricket Banner" class="banner" />
      <img src="images/logo.jpg" alt="Cricket Blog Logo" class="logo-over-banner" />
      <h1 class="banner-text">Cricket Pulse</h1>
    </div>
  </header>

  <!-- Navigation Bar -->
  <nav>
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="older.html">Older Posts</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html">Register</a></li>
      <li><a href="write.html" class="active">Write Post</a></li>
      <li><a href="our_story.html">Our Story</a></li>
    </ul>
  </nav>


  <main>
    <!-- Page title -->
    <h1>Write a New Blog Post</h1>
    <p class="write-tagline">Share your cricket insights with the Cricket Pulse community!</p>

    <!-- Post submission form -->
    <form id="writeForm" novalidate>
      <!-- Post Title -->
      <label for="postTitle">Post Title:</label>
      <input type="text" id="postTitle" name="postTitle" maxlength="100" />

      <!-- Tags or Keywords -->
      <label for="postTags">Tags/Keywords:</label>
      <input type="text" id="postTags" name="postTags" placeholder="e.g. Ashes, T20, Smith" />

      <!-- Blog Content -->
      <label for="postContent">Content:</label>
      <textarea id="postContent" name="postContent" rows="8"></textarea>

      <!-- Buttons -->
      <button type="submit">Publish</button>
      <button type="reset">Reset</button>

      <!-- Error message -->
      <p class="error-message" id="writeError"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Cricket Australia Blog | Designed by Syed, Billal, Oishe & Hasan</p>
  </footer>

  <!-- Scroll-to-Top Button -->
  <button id="scrollTopBtn" title="Back to Top">↑</button>

</body>

</html>
