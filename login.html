<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Syed, Billal, Oishe & Hasan" />
  <title>Cricket Australia Blog - Login</title>

  <!-- External CSS file for styling -->
  <link rel="stylesheet" href="styles/style.css" />

  <!-- External JS file for login validation -->
  <script defer src="scripts/main.js"></script>
</head>

<body>
  <header>
    <!-- Top banner with site logo and site name -->
    <div class="banner-container">
      <!-- Dark/Light Theme Toggle Button -->
      <button id="themeToggleBtn" title="Toggle Dark/Light Mode">Dark Mode 🌓</button>
      <img src="images/banner.webp" alt="Cricket Banner" class="banner" />
      <img src="images/logo.jpg" alt="Cricket Blog Logo" class="logo-over-banner" />
      <h1 class="banner-text">Cricket Pulse</h1>
    </div>
  </header>

  <!-- Navigation Bar -->
  <nav>
    <ul class="nav-menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="older.html">Older Posts</a></li>
      <li><a href="login.html" class="active">Login</a></li>
      <li><a href="register.html">Register</a></li>
      <li><a href="write.html">Write Post</a></li>
      <li><a href="our_story.html">Our Story</a></li>
    </ul>
  </nav>


  <main>
    <h1>Login to Your Account</h1>

    <p class="login-tagline">Welcome back to Cricket Pulse — your hub for all things cricket!</p>

    <!-- Login form with client-side validation using JS -->
    <!-- novalidate disables browser's built-in validation -->
    <form id="loginForm" novalidate>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" />

      <label for="password">Password:</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" />
        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">Show</button>
      </div>


      <button type="submit">Login</button>

      <!-- Error message will appear here if fields are invalid -->
      <p class="error-message" id="loginError"></p>
    </form>

    <!-- Link to register page for new users -->
    <p>Don't have an account? <a href="register.html">Register here</a>.</p>
  </main>

  <!-- Footer (common across site) -->
  <footer>
    <p>&copy; 2025 Cricket Australia Blog | Designed by Syed, Billal, Oishe & Hasan</p>
  </footer>

  <!-- Scroll-to-Top Button -->
  <button id="scrollTopBtn" title="Back to Top">↑</button>

</body>

</html>
